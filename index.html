<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}</style>
<title>Please Add Me Back</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: one narrow "support desk" form that turns into a verdict card; the runaway No button is the single loud moment. */
:root{
  --bg:#F2F5F1; --surface:#FFFFFF; --fg:#14211B; --muted:#5A6A61; --line:#D5DED7;
  --accent:#E23E64; --accent-ink:#FFFFFF; --soft:#FBE4EA; --good:#1F8A5F; --good-soft:#DDF1E7;
  --display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'DM Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1714; --surface:#172420; --fg:#E9F1EC; --muted:#9BB0A5; --line:#2A3B34;
    --accent:#FF6B8C; --accent-ink:#1A0A10; --soft:#3A1D27; --good:#4CC794; --good-soft:#143A2A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1714; --surface:#172420; --fg:#E9F1EC; --muted:#9BB0A5; --line:#2A3B34;
  --accent:#FF6B8C; --accent-ink:#1A0A10; --soft:#3A1D27; --good:#4CC794; --good-soft:#143A2A;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg); font-family:var(--body); font-size:16px; line-height:1.5;
  padding-block:32px 56px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.wrap{max-width:560px; margin:0 auto; display:flex; flex-direction:column; gap:20px}
.ticket{font-family:var(--mono); font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 0 10px}
h1{font-family:var(--display); font-weight:800; font-size:clamp(2.4rem,9vw,3.6rem); line-height:1; letter-spacing:-.02em; margin:0 0 12px; text-wrap:balance}
h1 em{font-style:normal; color:var(--accent)}
.lede{margin:0; color:var(--muted); max-width:46ch}

.panel{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:20px; display:flex; flex-direction:column; gap:22px}
.row{display:grid; grid-template-columns:1fr 1fr; gap:12px}
@media (max-width:440px){.row{grid-template-columns:1fr}}
label,.lbl{display:block; font-family:var(--mono); font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-bottom:6px}
input[type=text],textarea{
  width:100%; font:inherit; color:var(--fg); background:var(--bg); border:1px solid var(--line);
  border-radius:8px; padding:10px 12px; min-width:0;
}
textarea{resize:vertical; min-height:92px}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--accent); outline-offset:2px}

.field-head{display:flex; justify-content:space-between; align-items:baseline; gap:12px}
.meter-val{font-family:var(--mono); font-size:13px; color:var(--accent); text-align:right}
input[type=range]{width:100%; accent-color:var(--accent); height:28px}

.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{
  font:inherit; font-size:14px; color:var(--fg); background:var(--bg); border:1px solid var(--line);
  border-radius:999px; padding:7px 14px; cursor:pointer; transition:background .15s, border-color .15s, color .15s;
}
.chip[aria-pressed="true"]{background:var(--soft); border-color:var(--accent); color:var(--fg); font-weight:700}
.offer-total{font-family:var(--mono); font-size:12px; color:var(--muted); margin:10px 0 0}

.arena{position:relative; height:176px; border:1px dashed var(--line); border-radius:10px; overflow:hidden}
.btn{font:inherit; font-weight:700; border-radius:10px; border:0; cursor:pointer; padding:14px 20px}
.btn-yes{position:absolute; left:12px; bottom:12px; background:var(--accent); color:var(--accent-ink); font-size:17px; padding:16px 24px; transition:transform .12s}
.btn-yes:hover{transform:translateY(-2px)}
.btn-yes:active{transform:translateY(1px)}
.btn-no{
  position:absolute; left:calc(100% - 140px); top:12px; z-index:2;
  background:var(--surface); color:var(--fg); border:1px solid var(--line); font-size:14px; padding:10px 14px;
  transition:left .22s cubic-bezier(.3,1.4,.5,1), top .22s cubic-bezier(.3,1.4,.5,1), background .2s;
}
.btn-no.gave-up{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.tries{font-family:var(--mono); font-size:12px; color:var(--muted); margin:10px 0 0; min-height:1.5em}

.steps{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:12px}
.steps li{display:grid; grid-template-columns:22px 1fr; gap:10px; align-items:center; color:var(--muted); transition:color .2s}
.dot{width:18px; height:18px; border-radius:50%; border:2px solid var(--line); display:grid; place-items:center; font-size:11px; line-height:1; color:transparent; transition:all .2s}
.steps li.doing{color:var(--fg)}
.steps li.doing .dot{border-color:var(--accent); border-top-color:transparent; animation:spin .7s linear infinite}
.steps li.done{color:var(--fg)}
.steps li.done .dot{background:var(--good); border-color:var(--good); color:var(--surface)}
.bar{height:6px; background:var(--bg); border-radius:99px; overflow:hidden}
.bar i{display:block; height:100%; width:0; background:var(--accent); transition:width .5s ease}
@keyframes spin{to{transform:rotate(360deg)}}

.stamp{
  display:inline-block; align-self:flex-start; font-family:var(--mono); font-size:12px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--accent); border:2px solid var(--accent); border-radius:6px; padding:3px 10px; transform:rotate(-3deg);
}
.stamp.ok{color:var(--good); border-color:var(--good)}
h2{font-family:var(--display); font-weight:800; font-size:clamp(1.6rem,6vw,2.1rem); line-height:1.1; margin:0; letter-spacing:-.01em; text-wrap:balance}
.verdict p{margin:0; color:var(--muted)}
.actions{display:flex; flex-wrap:wrap; gap:10px}
.btn-accept{background:var(--good); color:var(--surface)}
.btn-decline{background:var(--bg); color:var(--fg); border:1px solid var(--line)}
.btn-ghost{background:transparent; color:var(--muted); text-decoration:underline; padding:8px 4px; font-weight:500; font-size:14px}
.fine{font-family:var(--mono); font-size:12px; color:var(--muted)}
.good-box{background:var(--good-soft); border-radius:10px; padding:14px 16px; color:var(--fg)}

#confetti{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:20}

@media (prefers-reduced-motion: reduce){
  *{transition:none !important; animation-duration:.01ms !important}
}
</style>


</head>
<body>
<main class="wrap">
  <header>
    <p class="ticket">Request <span id="tno">#0000</span> · <span id="tdate"></span></p>
    <h1>Please add me back, <em>Noor</em>.</h1>
    <p class="lede">Official request to be re-added to Noor's account. Average processing time depends on how convincing this page is.</p>
  </header>

  <form id="reqForm" class="panel" autocomplete="off">
    <div>
      <div class="field-head"><label for="sorry" style="margin:0">How sorry I am</label><span class="meter-val" id="sorryVal">dramatically sorry · 70%</span></div>
      <input type="range" id="sorry" min="0" max="100" value="70">
    </div>

    <div>
      <span class="lbl">What I'm offering</span>
      <div class="chips" id="chips">
        <button type="button" class="chip" aria-pressed="true" data-v="6">Kinder Joys</button>
        <button type="button" class="chip" aria-pressed="true" data-v="4">Beat me</button>
        <button type="button" class="chip" aria-pressed="true" data-v="4">Punch me</button>
        <button type="button" class="chip" aria-pressed="true" data-v="6">Chotu for a week</button>
      </div>
      <p class="offer-total" id="offerTotal"></p>
    </div>

    <div>
      <label for="msg">Message</label>
      <textarea id="msg">plz plz plz plz plz plz addd me back ill behave</textarea>
    </div>

    <div>
      <div class="arena" id="arena">
        <button type="submit" class="btn btn-yes" id="yes">Yes, I'll add you back</button>
        <button type="button" class="btn btn-no" id="no">No, I'm still mad</button>
      </div>
      <p class="tries" id="tries" aria-live="polite"></p>
    </div>
  </form>

  <section id="processing" class="panel" hidden>
    <span class="lbl" style="margin:0">Processing request</span>
    <div class="bar" aria-hidden="true"><i id="barFill"></i></div>
    <ul class="steps" id="steps"></ul>
  </section>

  <section id="verdict" class="panel verdict" hidden>
    <span class="stamp" id="stamp">Awaiting decision</span>
    <h2 id="vTitle"></h2>
    <p id="vBody"></p>
    <div class="actions" id="vActions">
      <button type="button" class="btn btn-accept" id="accept">Accept request</button>
      <button type="button" class="btn btn-decline" id="decline">Decline</button>
    </div>
    <div class="good-box" id="goodBox" hidden></div>
    <button type="button" class="btn btn-ghost" id="again" hidden style="align-self:flex-start">Run it again</button>
  </section>

</main>

<canvas id="confetti" aria-hidden="true"></canvas>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // header details
  $('tno').textContent = '#' + (1000 + Math.floor(Math.random()*9000));
  $('tdate').textContent = new Date().toLocaleDateString(undefined, {day:'numeric', month:'short', year:'numeric'});


  // sorry meter
  var levels = [[20,'mildly sorry'],[40,'properly sorry'],[60,'very sorry'],[80,'dramatically sorry'],[99,'legally sorry'],[100,'beyond measurement']];
  function updSorry(){
    var v = +$('sorry').value, t = levels[levels.length-1][1];
    for (var i=0;i<levels.length;i++){ if (v <= levels[i][0]) { t = levels[i][1]; break; } }
    $('sorryVal').textContent = t + ' · ' + v + '%';
  }
  $('sorry').addEventListener('input', updSorry); updSorry();

  // offers
  var chips = Array.prototype.slice.call(document.querySelectorAll('.chip'));
  function updOffers(){
    var n = 0, total = 0;
    chips.forEach(function(c){ if (c.getAttribute('aria-pressed') === 'true'){ n++; total += +c.dataset.v; } });
    $('offerTotal').textContent = n + (n === 1 ? ' offer' : ' offers') + ' on the table · bribe value ' + total + '/20';
    return n;
  }
  chips.forEach(function(c){
    c.addEventListener('click', function(){
      c.setAttribute('aria-pressed', c.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
      updOffers();
    });
  });
  updOffers();

  // runaway No button
  var arena = $('arena'), no = $('no'), yes = $('yes');
  var dodges = 0, gaveUp = false;
  var triesMsgs = ['', 'Nice try.', 'It moved.', 'Still moving.', 'It really does not want to be clicked.', 'Almost out of energy.'];

  function overlaps(a, b){
    return !(a.x + a.w < b.x || b.x + b.w < a.x || a.y + a.h < b.y || b.y + b.h < a.y);
  }
  function dodge(){
    var maxX = arena.clientWidth - no.offsetWidth - 4;
    var maxY = arena.clientHeight - no.offsetHeight - 4;
    var yr = {x: yes.offsetLeft - 8, y: yes.offsetTop - 8, w: yes.offsetWidth + 16, h: yes.offsetHeight + 16};
    var x = 4, y = 4;
    for (var i=0;i<14;i++){
      x = 4 + Math.random()*Math.max(0, maxX);
      y = 4 + Math.random()*Math.max(0, maxY);
      if (!overlaps({x:x, y:y, w:no.offsetWidth, h:no.offsetHeight}, yr)) break;
    }
    no.style.left = x + 'px';
    no.style.top = y + 'px';
    dodges++;
    if (dodges >= 6){
      gaveUp = true;
      no.classList.add('gave-up');
      no.textContent = 'Fine. Yes.';
      $('tries').textContent = 'You tried to say no ' + dodges + ' times. The button gave up.';
    } else {
      $('tries').textContent = triesMsgs[Math.min(dodges, triesMsgs.length-1)] + ' (' + dodges + ')';
    }
  }
  function runAway(e){ if (!gaveUp){ if (e && e.cancelable) e.preventDefault(); dodge(); } }
  no.addEventListener('pointerenter', runAway);
  no.addEventListener('pointerdown', runAway);
  no.addEventListener('focus', runAway);
  no.addEventListener('click', function(e){
    if (!gaveUp){ e.preventDefault(); dodge(); return; }
    startProcessing();
  });

  // processing
  var steps = [
    'Checking how long it has been since the fight',
    'Reading the apology twice',
    'Counting the snacks on offer',
    'Asking her heart (no answer, trying again)',
    'Verdict ready'
  ];
  var stepList = $('steps');
  function startProcessing(){
    if (startProcessing.busy) return;
    startProcessing.busy = true;
    $('reqForm').hidden = true;
    $('processing').hidden = false;
    $('verdict').hidden = true;
    stepList.innerHTML = '';
    $('barFill').style.width = '0';
    var lis = steps.map(function(s){
      var li = document.createElement('li');
      li.innerHTML = '<span class="dot">✓</span><span></span>';
      li.lastChild.textContent = s;
      stepList.appendChild(li);
      return li;
    });
    var gap = reduce ? 250 : 950;
    var i = 0;
    (function next(){
      if (i > 0){ lis[i-1].className = 'done'; }
      if (i >= lis.length){ $('barFill').style.width = '100%'; setTimeout(showVerdict, reduce ? 100 : 500); return; }
      lis[i].className = 'doing';
      $('barFill').style.width = Math.round(((i+0.5)/lis.length)*100) + '%';
      i++;
      setTimeout(next, gap);
    })();
  }
  $('reqForm').addEventListener('submit', function(e){ e.preventDefault(); startProcessing(); });

  // verdict
  var declineLabels = ['Decline', 'Are you sure?', 'Really sure?', 'The Kinder Joys are still on offer', 'Last chance', 'Okay, accepting for you'];
  var declines = 0;
  function showVerdict(){
    $('processing').hidden = true;
    $('verdict').hidden = false;
    $('stamp').textContent = 'Awaiting decision';
    $('stamp').className = 'stamp';
    $('vTitle').textContent = 'Request is ready for Noor.';
    $('vBody').textContent = 'Everything checks out. One decision left, and only one person can make it.';
    $('accept').textContent = 'Accept request';
    $('decline').textContent = declineLabels[0];
    $('vActions').hidden = false;
    $('goodBox').hidden = true;
    $('again').hidden = true;
    declines = 0;
  }
  function accepted(){
    $('stamp').textContent = 'Accepted';
    $('stamp').className = 'stamp ok';
    $('vTitle').textContent = 'Added back. Good behavior starts now.';
    $('vBody').textContent = 'Request closed. The Kinder Joys are being delivered and the chotu week begins.';
    $('vActions').hidden = true;
    $('goodBox').hidden = false;
    $('goodBox').textContent = 'One last step: tap the real accept button in the real app.';
    $('again').hidden = false;
    burst();
  }
  $('accept').addEventListener('click', accepted);
  $('decline').addEventListener('click', function(){
    if (declines < declineLabels.length - 1){
      declines++;
      $('decline').textContent = declineLabels[declines];
      if (declines === declineLabels.length - 1){ setTimeout(accepted, 900); }
    }
  });
  $('again').addEventListener('click', function(){
    startProcessing.busy = false;
    dodges = 0; gaveUp = false;
    no.classList.remove('gave-up');
    no.textContent = "No, I'm still mad";
    no.style.left = ''; no.style.top = '';
    $('tries').textContent = '';
    $('verdict').hidden = true;
    $('reqForm').hidden = false;
    window.scrollTo(0, 0);
  });

  // confetti
  var cv = $('confetti'), cx = cv.getContext('2d'), parts = [], raf = 0;
  var colors = ['#E23E64','#FF6B8C','#1F8A5F','#F2B134','#4C8DF6','#FFFFFF'];
  function size(){ cv.width = window.innerWidth; cv.height = window.innerHeight; }
  window.addEventListener('resize', size); size();
  function burst(){
    if (reduce) return;
    for (var i=0;i<140;i++){
      parts.push({
        x: cv.width/2, y: cv.height*0.55,
        vx: (Math.random()-0.5)*14, vy: -Math.random()*14 - 4,
        w: 6 + Math.random()*6, h: 4 + Math.random()*5,
        r: Math.random()*6, vr: (Math.random()-0.5)*0.4,
        c: colors[Math.floor(Math.random()*colors.length)], life: 0
      });
    }
    if (!raf) raf = requestAnimationFrame(tick);
  }
  function tick(){
    cx.clearRect(0, 0, cv.width, cv.height);
    parts = parts.filter(function(p){ return p.life < 160 && p.y < cv.height + 20; });
    parts.forEach(function(p){
      p.life++; p.vy += 0.35; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.fillRect(-p.w/2, -p.h/2, p.w, p.h); cx.restore();
    });
    if (parts.length){ raf = requestAnimationFrame(tick); } else { raf = 0; cx.clearRect(0, 0, cv.width, cv.height); }
  }
})();
</script>

</body>
</html>
